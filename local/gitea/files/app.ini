# Gitea config, FreeBSD-port layout (/var/db/gitea, git user).
# ${JAIL_IP} is substituted by `bastille template` (RENDER).
# Placeholder secrets below are generated on first apply, see Bastillefile.
APP_NAME = Gitea
RUN_MODE = prod
RUN_USER = git

[server]
DOMAIN = ${JAIL_IP}
HTTP_ADDR = 0.0.0.0
HTTP_PORT = 3000
ROOT_URL = http://${JAIL_IP}:3000/
DISABLE_SSH = false
SSH_DOMAIN = %(DOMAIN)s
SSH_PORT = 2202
APP_DATA_PATH = /var/db/gitea/data
OFFLINE_MODE = false

[database]
DB_TYPE = postgres
HOST = 127.0.0.1:5432
NAME = gitea
USER = gitea
PASSWD = gitea-pg-dev-secret
SCHEMA = public
SSL_MODE = disable

[indexer]
ISSUE_INDEXER_PATH = /var/db/gitea/indexers/issues.bleve

[log]
LEVEL = Info
MODE = file
ROOT_PATH = /var/log/gitea

[mailer]
ENABLED = false

[oauth2]
JWT_SECRET = CHANGE_ME

[picture]
AVATAR_UPLOAD_PATH = /var/db/gitea/data/avatars
DISABLE_GRAVATAR = true
ENABLE_FEDERATED_AVATAR = false

[repository]
ROOT = /var/db/gitea/gitea-repositories
SCRIPT_TYPE = sh

[repository.upload]
TEMP_PATH = /var/db/gitea/data/tmp/uploads

[security]
INSTALL_LOCK = true
INTERNAL_TOKEN = CHANGE_ME
SECRET_KEY = CHANGE_ME

[session]
PROVIDER = file
PROVIDER_CONFIG = /var/db/gitea/data/sessions

[service]
DISABLE_REGISTRATION = true
ENABLE_CAPTCHA = false
ENABLE_NOTIFY_MAIL = false
REGISTER_EMAIL_CONFIRM = false
REQUIRE_SIGNIN_VIEW = false
