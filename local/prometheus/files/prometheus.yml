# Prometheus scraping itself, the local node_exporter, and anything else
# you add here (e.g. more jails with node_exporter on :9100).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["localhost:9100"]
